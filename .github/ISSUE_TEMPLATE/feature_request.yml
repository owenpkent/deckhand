name: Feature request
description: Suggest something Deckhand should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What need does this serve?
      description: >
        Describe the situation you are in, not the feature you have in mind.
        What are you trying to get done, and what makes it awkward today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like Deckhand to do?
      description: If you already have a shape in mind, describe it here.

  - type: dropdown
    id: control
    attributes:
      label: Which control does this touch?
      multiple: true
      options:
        - Agent tiles
        - Command keys
        - Dial
        - Stick
        - Push-to-talk
        - Send
        - Layers / profiles
        - The surface itself (window, size, placement)
        - A new adapter for another agent runtime
        - None of these

  - type: textarea
    id: alternatives
    attributes:
      label: What are you doing instead right now?
      description: Workarounds are useful. They tell us how much this costs you.

  - type: checkboxes
    id: mouse-only
    attributes:
      label: Mouse-only check
      description: >
        Deckhand is operable with a pointer alone. Keyboard and voice are
        conveniences, never requirements.
      options:
        - label: This feature can be fully operated with a pointer alone
        - label: This feature would need the keyboard, and I have said why above
