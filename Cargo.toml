[workspace]
resolver = "2"
members = ["app/src-tauri", "shim"]

# The spike is intentionally not a member: it is frozen evidence for
# ADR-025, not part of the product build.
exclude = ["spikes/tauri-focus/src-tauri"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
