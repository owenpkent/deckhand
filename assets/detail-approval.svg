<svg width="560" height="330" viewBox="0 0 560 330" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, -apple-system, sans-serif">
  <!-- Design mockup of the detail panel during a pending approval.
       Drawn from docs/UI_SPEC.md and docs/SECURITY_MODEL.md. Nothing runs yet. -->
  <rect x="2" y="2" width="556" height="326" rx="16" fill="#1c2026" stroke="#343b45" stroke-width="1.5"/>

  <!-- identity line -->
  <text x="24" y="36" font-size="13" fill="#9aa0a6">Tile 3</text>
  <text x="72" y="36" font-size="13" font-weight="700" fill="#e8eaed">deckhand</text>
  <text x="148" y="36" font-size="13" fill="#9aa0a6">Opus</text>
  <rect x="188" y="22" width="70" height="20" rx="10" fill="#26313d"/>
  <text x="223" y="36" text-anchor="middle" font-size="10.5" fill="#8fb6e8">attached</text>

  <!-- state, in words, never colour alone -->
  <rect x="24" y="54" width="150" height="26" rx="13" fill="#3a2f18" stroke="#f5a623" stroke-width="1.5"/>
  <g transform="translate(38,60)" fill="#f5a623">
    <rect x="0" y="0" width="2.4" height="6.8" rx="1.2"/>
    <rect x="3.7" y="-1.4" width="2.4" height="8.2" rx="1.2"/>
    <rect x="7.4" y="0" width="2.4" height="6.8" rx="1.2"/>
    <rect x="-0.5" y="5.4" width="10.8" height="6.8" rx="3"/>
  </g>
  <text x="56" y="71" font-size="11.5" font-weight="700" fill="#f5c168">WAITING ON YOU</text>

  <!-- the pending tool call, shown before the buttons are live -->
  <text x="24" y="106" font-size="12" fill="#9aa0a6">Claude Code wants to run</text>
  <rect x="24" y="116" width="512" height="58" rx="8" fill="#14171b" stroke="#343b45" stroke-width="1"/>
  <text x="38" y="140" font-size="12.5" font-family="Consolas, monospace" font-weight="700" fill="#e8eaed">Bash</text>
  <text x="38" y="160" font-size="12" font-family="Consolas, monospace" fill="#b8bec7">cmake --build build --config Release</text>

  <!-- decision buttons: constructive and destructive, with the mandated dead gap -->
  <g transform="translate(24,192)">
    <rect width="150" height="46" rx="10" fill="#1f3a29" stroke="#3ecf6e" stroke-width="2"/>
    <path d="M 20 23 L 27 30 L 40 14" fill="none" stroke="#3ecf6e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="90" y="29" text-anchor="middle" font-size="13" font-weight="700" fill="#c9f2d6">Approve</text>
  </g>
  <g transform="translate(254,192)">
    <rect width="150" height="46" rx="10" fill="#26262b" stroke="#e5484d" stroke-width="2"/>
    <path d="M 22 15 L 36 31 M 36 15 L 22 31" stroke="#e5484d" stroke-width="2.6" stroke-linecap="round"/>
    <text x="92" y="29" text-anchor="middle" font-size="13" font-weight="700" fill="#f1b7b9">Deny</text>
  </g>
  <text x="452" y="220" font-size="10" fill="#6f7680" text-anchor="middle">answers in 52 s,</text>
  <text x="452" y="233" font-size="10" fill="#6f7680" text-anchor="middle">then returns to the terminal</text>

  <!-- session vitals -->
  <text x="24" y="270" font-size="11" fill="#9aa0a6">context</text>
  <rect x="76" y="262" width="180" height="8" rx="4" fill="#3a4048"/>
  <rect x="76" y="262" width="112" height="8" rx="4" fill="#4c8dff"/>
  <text x="266" y="270" font-size="11" fill="#b8bec7">62%</text>
  <text x="320" y="270" font-size="11" fill="#9aa0a6">$0.41 this session</text>

  <!-- single-click equivalents of every accelerator -->
  <g transform="translate(24,288)">
    <rect width="126" height="30" rx="8" fill="#26262b" stroke="#4a5058" stroke-width="1.4"/>
    <text x="63" y="20" text-anchor="middle" font-size="11" fill="#d5d9de">Raise window</text>
  </g>
  <g transform="translate(160,288)">
    <rect width="90" height="30" rx="8" fill="#26262b" stroke="#4a5058" stroke-width="1.4"/>
    <text x="45" y="20" text-anchor="middle" font-size="11" fill="#d5d9de">Unbind</text>
  </g>
  <g transform="translate(260,288)">
    <rect width="110" height="30" rx="8" fill="#26262b" stroke="#4a5058" stroke-width="1.4"/>
    <text x="55" y="20" text-anchor="middle" font-size="11" fill="#d5d9de">Settings</text>
  </g>
</svg>
