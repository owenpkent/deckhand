[package]
name = "deckhand"
version = "0.1.0"
description = "Always-on-top, mouse-only control surface for Claude Code sessions"
edition = "2021"
publish = false
# CVE-2024-24576: rustc before 1.77.2 could mis-quote arguments passed
# to a Windows .cmd/.bat via std::process::Command, letting a hostile
# argument break out of quoting. reveal.rs launches code.cmd, so this
# floor is load-bearing, not routine hygiene.
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
tiny_http = "0.12"
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Console",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_Security",
] }
