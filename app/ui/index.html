<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Deckhand</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="surface" aria-label="Deckhand surface">
    <div id="strip" role="group" aria-label="Agent tiles"></div>
    <div id="side">
      <button id="refresh" class="side-btn" aria-label="Refresh sessions">
        <span class="side-glyph">&#8635;</span><span class="side-label">Scan</span>
      </button>
      <button id="quit" class="side-btn" aria-label="Quit Deckhand">
        <span class="side-glyph">&#10005;</span><span class="side-label">Quit</span>
      </button>
    </div>
    <div id="picker" hidden></div>
  </main>
  <script type="module" src="./dist/main.js"></script>
</body>
</html>
