<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Deckhand</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="surface" aria-label="Deckhand surface">
    <div id="header" data-tauri-drag-region>
      <div id="summary" aria-label="Session counts"></div>
      <button id="gear" class="side-btn" aria-pressed="false"></button>
      <button id="quit" class="side-btn" aria-label="Quit Deckhand">&#10005;</button>
    </div>
    <div id="list" role="group" aria-label="Sessions"></div>
  </main>
  <script type="module" src="./dist/main.js"></script>
</body>
</html>
